version: '3.8'

services:

  nginx:
    image: nginx:1.23
    container_name: webserver
    ports:
      - 8080:80
    volumes:
      - ./php:/var/www/php
      - ./.docker/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - php

  php:
    build: ./.docker/php/
    working_dir: /var/www/php
    container_name: php
    restart: unless-stopped
    expose:
      - 9000
    volumes:
      - ./php:/var/www/php
      - ./.docker/php/conf.d/xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini
      - ./.docker/php/conf.d/error_reporting.ini:/usr/local/etc/php/conf.d/error_reporting.ini
    environment:
      - JSON_SERVER_BASE=http://json-server:3000
    depends_on:
      - json-server

  json-server:
    image: node:18-alpine
    container_name: json-server
    working_dir: /data
    command: sh -c "npx json-server --watch /data/users.json --port 3000"
    ports:
      - "3001:3000"
    volumes:
      - ./php/data:/data:rw
    restart: unless-stopped

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: pruebadb
      MYSQL_USER: usuario
      MYSQL_PASSWORD: 1234
      MYSQL_ROOT_PASSWORD: 1234
    volumes:
      - persistent:/var/lib/mysql

volumes:
  persistent:
