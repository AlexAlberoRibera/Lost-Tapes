<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PI Lost Tapes</title>
  <link rel="stylesheet" href="/public/css/estilos_carrusel.css" />
  <link rel="stylesheet" href="/public/css/estilo.css" />

</head>

<body>
  <header>
    <img src="/public/img/Logo Tapes.png" alt="Logo Tapes" />
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="contacto.html">Contacto</a></li>
        <li><a href="#">Productos</a></li>
        <li><a href="#">Sell</a></li>
      </ul>
    </nav>

    <form class="search-bar" action="#" method="get">
      <input type="text" name="q" placeholder="Buscar..." />
      <button type="submit">Buscar</button>
    </form>
  </header>

  <main>
    <section class="hero">
      <h2 class="section-title">Best Memphis Lost Mixtapes</h2>

      <div class="carousel">
        <!-- Botón previo -->
        <button class="carousel-btn prev" aria-label="Anterior">&#10094;</button>

        <div class="carousel-track">
          <article class="carousel-item active">
            <img src="/public/img/Trap_Story.png" alt="Portada mixtape principal">
          </article>
          <article class="carousel-item">
            <img src="/public/img/Woppenheimer.png" alt="Portada mixtape secundaria">
          </article>
          <article class="carousel-item">
            <img src="/public/img/Looney_Tunes.png" alt="Portada mixtape secundaria">
          </article>
        </div>

        <!-- Botón siguiente -->
        <button class="carousel-btn next" aria-label="Siguiente">&#10095;</button>
      </div>

      <!-- Indicadores (puntos de navegación) -->
      <div class="carousel-indicators">
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>

    </section>
    <h1>Nuevas peliculas de culto</h1>

  </main>

  <script src="/js/carousel.js"></script>
</body>

</html>
